projects:
- title: GeoAI Mapping of Informal Settlements
  date: 2025 - Present
  description: >-
    Mapping informal settlements across Manila, Jakarta, and Bangkok by fusing interpretable urban-form indicators
    with remote-sensing foundation-model features, and examining their exposure to flood hazards.
- title: Urban Mobility Resilience to Extreme Weather
  date: 2024 - Present
  description: >-
    Quantifying how taxi, bike-share, and subway systems in New York City were disrupted by and recovered from
    Hurricane Ida, and how transportation diversity relates to mobility resilience.
- title: Causal Mechanisms of Mobility Resilience
  date: 2026 - Present
  description: >-
    Moving beyond association to identify the causal drivers of urban mobility resilience under extreme weather.
- title: Terrain Reconstruction with Deep Learning
  date: 2021 - 2024
  description: >-
    Reconstructing high-resolution DEMs from terrain features with conditional GANs, and extracting check dam systems
    from remote sensing images and DEMs on the Loess Plateau.

